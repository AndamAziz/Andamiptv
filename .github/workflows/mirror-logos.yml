name: Mirror live-channel logos (imgur is blocked in some regions)

# After playlist.m3u changes (form, upload, import), every live channel whose logo is on
# imgur gets a small copy in /logos, served from raw.githubusercontent.com, because imgur
# shows "Content not viewable in your region" in Kurdistan. Movies/series are never touched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [playlist.m3u]

concurrency:
  group: playlist-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]' && github.actor != 'Andam Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pillow
      - name: Mirror new imgur logos
        run: |
          python mirror_logos.py playlist.m3u
          python mirror_logos.py library/playlist.snapshot.m3u
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logos playlist.m3u library/playlist.snapshot.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Mirror imgur logos for live channels [skip ci]"
          git pull --rebase --autostash origin main
          git push
