name: Series sync (Show TV + TRT tabii + TV8 official links + own M3U sources)

# Every 3 hours (and on demand):
#  1. series_discover.py - a NEW drama on Show TV (/diziler), TV8 (/diziler) or tabii (new in its sitemap)
#     that is not in the playlist yet is added with all its free episodes (name, TMDB tag, poster,
#     seasons). TV programmes are never added (only series and films are wanted).
#  2. showtv_sync.py - for every Show TV, TRT (tabii) and TV8 series in Turkish Drama, Documentary Series
#     and Kids Series: new episodes are added and other links are switched to the official one
#     (ciner MP4 / tabii clear HLS / TV8 MP4) - only when that link plays.
#  3. m3u_sources.py - the owner's M3U links in library/sources.txt: new, playing, token-free episodes /
#     movies with a TMDB id are added in the playlist format (poster, group of their TMDB type).
# Working links without an official replacement stay as they are. Nothing is ever deleted. Changes go
# straight to main. Kanal D / Star / ATV / NOW are not covered: they give no token-free links.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only (do not change the playlist)"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"    # every 3 hours (00:17, 03:17, ... UTC)

permissions:
  contents: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  showtv-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: New series + new episodes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          APPLY="--apply"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then APPLY=""; fi
          echo "APPLY=$APPLY" >> "$GITHUB_ENV"
          python series_discover.py playlist.m3u $APPLY --report series-discover-report.txt
          python showtv_sync.py playlist.m3u $APPLY --report showtv-sync-report.txt
          command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; } || true
          python m3u_sources.py playlist.m3u $APPLY --report sources-report.txt || true
          { echo '### New series'; echo '```'; cat series-discover-report.txt; echo '```';
            echo '### New episodes'; echo '```'; cat showtv-sync-report.txt; echo '```';
            echo '### Own M3U sources (library/sources.txt)'; echo '```'; cat sources-report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          FILES="playlist.m3u library/playlist.snapshot.m3u library/tabii-seen.json library/sources-state.json showtv-series.json tabii-series.json tv8-series.json"
          [ -z "$(git status --porcelain -- $FILES)" ] && { echo "Series sync: nothing to change."; exit 0; }
          python repair_playlist.py --update-snapshot playlist.m3u library/playlist.snapshot.m3u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Series sync: new series / episodes / official links (run ${GITHUB_RUN_ID}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            # main moved and conflicts: redo both steps on top of the latest main
            git reset --hard origin/main
            python series_discover.py playlist.m3u --apply --report series-discover-report.txt
            python showtv_sync.py playlist.m3u --apply --report showtv-sync-report.txt
            python m3u_sources.py playlist.m3u --apply --report sources-report.txt || true
              [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
            python repair_playlist.py --update-snapshot playlist.m3u library/playlist.snapshot.m3u
            git add $FILES
            git commit -m "Series sync: new series / episodes / official links (run ${GITHUB_RUN_ID}) [skip ci]"
          done
          exit 1
