name: Auto-heal playlist after upload

# When playlist.m3u is changed by a person (GitHub "Add files via upload", web editor, or a
# panel export), restore movies/series/live-channel attributes and re-run the build.
on:
  push:
    branches: [main]
    paths: [playlist.m3u]

concurrency:
  group: playlist-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heal:
    if: github.actor != 'github-actions[bot]' && github.actor != 'Andam Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Repair, build, refresh snapshot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only touch the file when the upload is damaged (panel export). A healthy upload or a
          # web-form addition is left exactly as the user made it.
          python repair_playlist.py playlist.m3u library/playlist.snapshot.m3u
          if ! git diff --quiet playlist.m3u; then python build_playlist.py --overwrite; fi
          # New movies/episodes with a group that does not exist (web form: "Kurdish Drama", "Movies")
          # get their real group (the series' own group, or from TMDB); only group-title changes.
          python vod_group_fix.py playlist.m3u library/playlist.snapshot.m3u || true
          # Brand-new live channels (e.g. from the web form) get a group; nothing else is touched.
          python categorize_new.py playlist.m3u library/playlist.snapshot.m3u
          # New episodes typed with their overall number (S01E24) get their real season/episode (S02E08).
          python season_fix.py playlist.m3u library/playlist.snapshot.m3u || true
          python repair_playlist.py --update-snapshot playlist.m3u library/playlist.snapshot.m3u
          git checkout -- playlist.m3u.bak playlist.m3u.prelogo.bak 2>/dev/null || true
          git add playlist.m3u library/playlist.snapshot.m3u playlist_report.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Auto-heal playlist after upload (restore movies/series/live attributes) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            python repair_playlist.py playlist.m3u library/playlist.snapshot.m3u
            if ! git diff --quiet playlist.m3u; then python build_playlist.py --overwrite; fi
            python vod_group_fix.py playlist.m3u library/playlist.snapshot.m3u || true
            python categorize_new.py playlist.m3u library/playlist.snapshot.m3u
            python season_fix.py playlist.m3u library/playlist.snapshot.m3u || true
            git checkout -- playlist.m3u.bak playlist.m3u.prelogo.bak 2>/dev/null || true
            git add playlist.m3u library/playlist.snapshot.m3u playlist_report.txt
            git commit -m "Auto-heal playlist after upload [skip ci]" || exit 0
          done
          exit 1
