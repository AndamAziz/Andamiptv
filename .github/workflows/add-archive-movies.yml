name: Add free movies from Internet Archive

# Finds LICENSED (public domain / CC0) movies on the Internet Archive and adds direct mp4 links to
# playlist.m3u. Nothing is stored on your VPS or Lovable: the files stay on archive.org.
# Default is a REPORT ONLY (dry run): read the table in the run summary, then run again with dry_run=false.
on:
  schedule:
    - cron: "15 4 * * 0"   # every Sunday: REPORT ONLY, never changes playlist.m3u
  workflow_dispatch:
    inputs:
      sources:
        description: 'Source adapters (comma separated): internet_archive, wikimedia'
        default: 'internet_archive,wikimedia'
      max_items:
        description: 'Maximum movies to accept (best ranked first)'
        default: '20'
      primary_years:
        description: 'Preferred pool: movies released in the last N years'
        default: '2'
      secondary_years:
        description: 'Secondary pool: released in the last N years (older movies are rejected)'
        default: '5'
      min_height:
        description: 'Minimum VERIFIED resolution (both dimensions): 1080 = Full HD, 4K preferred. Unknown resolution is rejected.'
        default: '1080'
      min_minutes:
        description: 'Minimum length in minutes (40 = feature films)'
        default: '40'
      min_rating:
        description: 'Minimum TMDB rating (0 = any)'
        default: '0'
      min_votes:
        description: 'Minimum TMDB vote count (0 = any)'
        default: '0'
      query:
        description: 'Optional extra search words'
        default: ''
      group:
        description: 'Group name when TMDB gives no genre'
        default: 'Recent Movies'
      allow_cc_by:
        description: 'Also allow CC-BY / CC-BY-SA (credit the creator)'
        type: boolean
        default: true
      allow_webm:
        description: 'Also allow webm/ogv (Wikimedia Commons only has these; the app may not play them)'
        type: boolean
        default: false
      dry_run:
        description: 'Report only (true, default) or really add to playlist.m3u (false: creates a branch + pull request, never touches main)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests (duplicates, release year, sources, resolution, safe write)
        run: python -m unittest discover -s tests -v
      - name: Discover, validate, report (and add)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SOURCES: ${{ inputs.sources || 'internet_archive,wikimedia' }}
          MAX_ITEMS: ${{ inputs.max_items || '20' }}
          PRIMARY_YEARS: ${{ inputs.primary_years || '2' }}
          SECONDARY_YEARS: ${{ inputs.secondary_years || '5' }}
          MIN_HEIGHT: ${{ inputs.min_height || '1080' }}
          MIN_MINUTES: ${{ inputs.min_minutes || '40' }}
          MIN_RATING: ${{ inputs.min_rating || '0' }}
          MIN_VOTES: ${{ inputs.min_votes || '0' }}
          QUERY: ${{ inputs.query || '' }}
          GROUP: ${{ inputs.group || 'Recent Movies' }}
          ALLOW_CC_BY: ${{ github.event_name == 'schedule' && 'true' || inputs.allow_cc_by }}
          ALLOW_WEBM: ${{ inputs.allow_webm || 'false' }}
          # only a manual run with dry_run unchecked may change the playlist; the weekly schedule never does
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && 'true' || 'false' }}
        run: |
          bash archive_run.sh
          cat archive-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: archive-report
          path: archive-report.md
          retention-days: 30
      - name: Commit to a NEW BRANCH (never to main) and open a pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet playlist.m3u && { echo "Nothing new to add - no branch created."; exit 0; }
          BR="archive-import-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          python repair_playlist.py --update-snapshot playlist.m3u library/playlist.snapshot.m3u
          git add playlist.m3u library/playlist.snapshot.m3u
          git commit -m "Add verified recent Full HD/4K licensed movies (report in run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin "$BR"
          echo "Review and merge: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BR}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --base main --head "$BR" --title "Import verified recent movies (run ${GITHUB_RUN_ID})" \
            --body "Created by the movie discovery workflow after a manual run with dry_run unchecked. Nothing is merged automatically: read the report in the run summary, then merge." \
            || echo "Could not open the PR automatically (repository setting). Use the compare link above."
