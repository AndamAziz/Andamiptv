name: Add free movies from Internet Archive

# Finds LICENSED (public domain / CC0) movies on the Internet Archive and adds direct mp4 links to
# playlist.m3u. Nothing is stored on your VPS or Lovable: the files stay on archive.org.
# Default is a REPORT ONLY (dry run): read the table in the run summary, then run again with dry_run=false.
on:
  schedule:
    - cron: "15 4 * * 0"   # every Sunday: REPORT ONLY, never changes playlist.m3u
  workflow_dispatch:
    inputs:
      collection:
        description: 'Archive collection (feature_films, classic_cartoons, silent_films, scifi_horror ...)'
        default: 'feature_films'
      query:
        description: 'Optional extra search words (empty = most popular first)'
        default: ''
      max_items:
        description: 'How many movies to add / list'
        default: '10'
      min_downloads:
        description: 'Skip titles with fewer downloads than this (quality filter)'
        default: '2000'
      min_height:
        description: 'Minimum VERIFIED resolution: 1080 = Full HD and 4K only (default). 0 turns the filter off. Unknown resolution is always excluded.'
        default: '1080'
      min_minutes:
        description: 'Minimum movie length in minutes (40 = feature films; lower it to see shorts)'
        default: '40'
      group:
        description: 'Group name in the playlist'
        default: 'Free Classics'
      include_pre1930:
        description: 'Also include films made in 1929 or earlier that have no license field (public domain by age)'
        type: boolean
        default: false
      allow_cc_by:
        description: 'Also allow CC-BY / CC-BY-SA (credit the creator)'
        type: boolean
        default: false
      dry_run:
        description: 'Report only (true) or really add to playlist.m3u (false)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests (resolution filter)
        run: python -m unittest discover -s tests -v
      - name: Search, check links, report (and add)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          COLLECTION: ${{ inputs.collection || 'feature_films' }}
          QUERY: ${{ inputs.query || '' }}
          MAX_ITEMS: ${{ inputs.max_items || '30' }}
          MIN_DOWNLOADS: ${{ inputs.min_downloads || '300' }}
          MIN_HEIGHT: ${{ inputs.min_height || '1080' }}
          MIN_MINUTES: ${{ inputs.min_minutes || '40' }}
          GROUP: ${{ inputs.group || 'Free Classics' }}
          INCLUDE_PRE1930: ${{ inputs.include_pre1930 || 'false' }}
          ALLOW_CC_BY: ${{ inputs.allow_cc_by || 'false' }}
          # only a manual run with dry_run unchecked may change the playlist; the weekly schedule never does
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && 'true' || 'false' }}
        run: |
          bash archive_run.sh
          cat archive-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: archive-report
          path: archive-report.md
          retention-days: 30
      - name: Commit to a NEW BRANCH (never to main) and open a pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet playlist.m3u && { echo "Nothing new to add - no branch created."; exit 0; }
          BR="archive-import-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          python repair_playlist.py --update-snapshot playlist.m3u library/playlist.snapshot.m3u
          git add playlist.m3u library/playlist.snapshot.m3u
          git commit -m "Add verified Full HD/4K licensed movies (report in run ${GITHUB_RUN_ID}) [skip ci]"
          git push origin "$BR"
          echo "Review and merge: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BR}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --base main --head "$BR" --title "Import verified licensed movies (run ${GITHUB_RUN_ID})" \
            --body "Created by the Add free movies workflow after a manual run with dry_run unchecked. Nothing is merged automatically: read the report in the run summary, then merge." \
            || echo "Could not open the PR automatically (repository setting). Use the compare link above."
