name: Daily Playlist Update (Clean + Check + Commit)

on:
  schedule:
    - cron: '0 0 * * *'   # ڕۆژانە کاتژمێر 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with latest main
        run: git pull origin main --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt, skipping."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json, skipping."
          fi

      # Step 1: dedupe, blocklist-filter, categorize, clean names.
      - name: Clean & categorize playlist
        run: python build_playlist.py --overwrite

      # Step 2: list unreachable stream URLs in dead-channels.txt. Does not modify playlist.m3u.
      - name: Report dead channels (report only, never removes)
        run: node check-dead-channels.mjs

      - name: Check for changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain -- playlist.m3u playlist.m3u.bak playlist_report.txt channel-health.json dead-channels.txt)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git add playlist.m3u playlist.m3u.bak playlist_report.txt channel-health.json dead-channels.txt
          git commit -m "Daily update: clean, categorize, remove dead channels [skip ci]"
          if ! git pull origin main --rebase; then
            # main moved while this long run was going (e.g. a merged PR) and
            # playlist.m3u conflicts. The playlist is generated, so rebuild it
            # on top of the latest main instead of hand-resolving a conflict.
            git rebase --abort
            cp dead-channels.txt channel-health.json "$RUNNER_TEMP/"
            git reset --hard origin/main
            cp "$RUNNER_TEMP/dead-channels.txt" "$RUNNER_TEMP/channel-health.json" .
            python build_playlist.py --overwrite
            git add playlist.m3u playlist.m3u.bak playlist_report.txt channel-health.json dead-channels.txt
            git commit -m "Daily update (rebuilt on latest main): clean, categorize [skip ci]"
          fi
          git push origin main
