name: Daily Playlist Update

on:
  schedule:
    - cron: '0 0 * * *' # یان هەر کاتێک کە بۆت داناوە
  workflow_dispatch:

jobs:
  update-playlist:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ۱. لێرەدا سکریپتەکەت کار دەکات (بۆ نموونە build_playlist.py)
    - name: Run playlist script
      run: python build_playlist.py

    # ۲. **ئەم بەشە نوێیە لێرە زیاد بکە (پێش پش کردن):**
    - name: Pull latest changes
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase

    # ۳. لە کۆتاییدا فەرمانی کۆمیت و پش کردن
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        git add .
        git commit -m "Daily update: clean, categorize, remove dead channels [skip ci]" || echo "No changes to commit"
        git push origin main
